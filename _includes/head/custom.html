<!-- Set language before first paint so assistive tech gets the right locale immediately. -->
<script>
  (function () {
    function normalizeLanguage(lang) {
      if (!lang) {
        return null;
      }

      var normalized = String(lang).toLowerCase();
      if (normalized.indexOf('zh') === 0) {
        return 'zh';
      }
      if (normalized.indexOf('en') === 0) {
        return 'en';
      }
      return null;
    }

    var preferredLanguage = null;

    try {
      preferredLanguage = normalizeLanguage(localStorage.getItem('lang'));
    } catch (e) {
      preferredLanguage = null;
    }

    if (!preferredLanguage) {
      var browserLanguages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || navigator.userLanguage || navigator.browserLanguage];

      for (var i = 0; i < browserLanguages.length; i += 1) {
        preferredLanguage = normalizeLanguage(browserLanguages[i]);
        if (preferredLanguage) {
          break;
        }
      }
    }

    if (!preferredLanguage) {
      preferredLanguage = 'en';
    }

    document.documentElement.lang = preferredLanguage === 'zh' ? 'zh-CN' : 'en';
  })();
</script>

<!-- Language toggle styles -->
<style>
  html[lang^="en"] [data-lang="zh"],
  html[lang^="zh"] [data-lang="en"] {
    display: none !important;
  }

  .lang-toggle-item {
    display: flex;
    align-items: center;
  }

  .greedy-nav .visible-links {
    display: flex;
    align-items: center;
    width: 100%;
    min-width: 0;
  }

  .greedy-nav .visible-links li {
    display: block;
  }

  .greedy-nav .visible-links .lang-toggle-item {
    margin-left: auto;
    flex: 0 0 auto;
  }

  #site-nav.greedy-nav {
    display: flex;
    align-items: center;
  }

  #site-nav.greedy-nav > button {
    position: static;
    flex: 0 0 auto;
    order: 2;
    pointer-events: auto;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #site-nav.greedy-nav > button .navicon {
    pointer-events: auto;
  }

  #site-nav.greedy-nav .visible-links {
    flex: 1 1 auto;
    order: 1;
  }

  #site-nav.greedy-nav .hidden-links {
    order: 3;
  }

  #site-nav .nav-accessibility-controls {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    flex: 0 0 auto;
    position: relative;
    z-index: 2;
  }

  /* Keep custom nav controls from being covered by greedy-nav's absolute menu button. */
  #site-nav.greedy-nav > button {
    position: static !important;
    right: auto !important;
    z-index: 1 !important;
    pointer-events: auto !important;
  }

  #site-nav.greedy-nav > button .navicon {
    pointer-events: auto !important;
  }

  #lang-toggle,
  #contrast-toggle {
    background: #2a2a2a;
    border: 1px solid #1a1a1a;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75em;
    color: #f5f5f5;
    padding: 2px 7px;
    letter-spacing: 0.03em;
    opacity: 0.92;
    transition: opacity 0.15s, background-color 0.15s, border-color 0.15s;
    line-height: 1.6;
  }

  #lang-toggle:hover,
  #contrast-toggle:hover,
  #lang-toggle:focus-visible,
  #contrast-toggle:focus-visible {
    opacity: 1;
    background: #1f1f1f;
    border-color: #111111;
  }

  #lang-toggle:focus-visible,
  #contrast-toggle:focus-visible,
  .greedy-nav > button:focus-visible,
  .author__urls-wrapper button:focus-visible {
    outline: 3px solid currentColor;
    outline-offset: 3px;
  }

  #contrast-toggle[aria-pressed="true"] {
    opacity: 1;
    font-weight: 700;
    background: #1b1b1b;
    border-color: #0d0d0d;
  }

  .lang-toggle-item.hidden,
  #lang-toggle.hidden,
  #contrast-toggle.hidden {
    display: inline-flex !important;
    visibility: visible !important;
  }

  html[data-contrast="high"] {
    color-scheme: dark;
    --hc-bg: #000000;
    --hc-text: #ffffff;
    --hc-border: #ffffff;
    --hc-link: #00ffff;
    --hc-link-hover: #ffff00;
    --hc-link-visited: #ff9cf7;
    --hc-focus-ring: #ffff00;
    --hc-focus-ring-offset: #000000;
    --global-base-color: #ffffff;
    --global-bg-color: #000000;
    --global-footer-bg-color: #000000;
    --global-border-color: #ffffff;
    --global-dark-border-color: #ffffff;
    --global-code-background-color: #000000;
    --global-code-text-color: #ffffff;
    --global-fig-caption-color: #ffffff;
    --global-link-color: var(--hc-link);
    --global-link-color-hover: var(--hc-link-hover);
    --global-link-color-visited: var(--hc-link-visited);
    --global-masthead-link-color: #ffffff;
    --global-masthead-link-color-hover: #ffff00;
    --global-text-color: #ffffff;
    --global-text-color-light: #ffffff;
    --global-thead-color: #000000;
    --global-toc-bg-color: #000000;
    --global-selection-bg-color: #ffff00;
    --global-selection-text-color: #000000;
  }

  html[data-contrast="high"] a {
    color: var(--hc-link);
    text-decoration: underline;
    text-underline-offset: 0.12em;
    text-decoration-thickness: 0.14em;

  html[data-contrast="high"] a:hover,

  }

  html[data-contrast="high"] a:visited {

  html[data-contrast="high"] .btn:focus-visible,

    outline-offset: 2px;
    box-shadow: 0 0 0 2px var(--hc-focus-ring-offset);
  }

  html[data-contrast="high"] ::selection {

  }

  html[data-contrast="high"] ::-moz-selection {

  html[data-contrast="high"] body,
  html[data-contrast="high"] .initial-content,
  html[data-contrast="high"] .page,
  html[data-contrast="high"] .archive {
    background: var(--hc-bg);

  html[data-contrast="high"] .masthead,
  html[data-contrast="high"] .page__footer,
  html[data-contrast="high"] .greedy-nav,

  html[data-contrast="high"] input,

  html[data-contrast="high"] .btn,

  html[data-contrast="high"] .btn:hover,
  html[data-contrast="high"] .btn:active,

  html[data-contrast="high"] button:active {
