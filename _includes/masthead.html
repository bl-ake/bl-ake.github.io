{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-nav-hidden-links"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a href="{{ base_path }}/" {% if page.url == '/' or page.url == '/index.html' %}aria-current="page"{% endif %}>{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}" data-nav-url="{{ link.url }}" {% if page.url contains link.url and link.url != '/' %}aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
          <li class="masthead__menu-item lang-toggle-item persist tail">
            <div class="nav-accessibility-controls">
              <button id="lang-toggle" type="button" aria-label="Switch language">EN / 中文</button>
              <button id="contrast-toggle" type="button" aria-label="Increase contrast" aria-pressed="false">
                <span data-lang="en">Contrast</span><span data-lang="zh">高对比度</span>
              </button>
            </div>
          </li>
        </ul>
        <ul id="site-nav-hidden-links" class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
